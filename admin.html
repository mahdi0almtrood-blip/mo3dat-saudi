<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة إعلانات معدات السعودية</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f5;
  color:#17221d;
}

header{
  background:#087052;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:15px;
}

.box,.ad{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  border:1px solid #dfe6e2;
}

.ad h3{
  color:#087052;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  font-size:16px;
  cursor:pointer;
}

.refresh{
  background:#087052;
  color:white;
}

.delete{
  background:#c62828;
  color:white;
  margin-top:10px;
}

.edit{background:#087052;color:white;margin-top:10px}
.images{display:flex;gap:8px;overflow:auto;margin:12px 0}
.images img{width:105px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;padding:15px;overflow:auto}
.modal.open{display:block}
.modal-box{max-width:650px;margin:20px auto;background:white;border-radius:14px;padding:20px}
.modal input,.modal textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd6d0;border-radius:8px}
.modal textarea{min-height:110px}
.save{background:#087052;color:white;margin-top:10px}
.cancel{background:#eee;color:#222;margin-top:8px}
.old-image{position:relative;flex:none}
.old-image button{position:absolute;top:3px;left:3px;width:28px;height:28px;padding:0;background:#c62828;color:white;border-radius:50%}

.status{
  text-align:center;
  padding:15px;
}

.auth-gate{position:fixed;inset:0;z-index:999;background:#f5f7f5;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:min(420px,100%);background:white;border:1px solid #dfe6e2;border-radius:16px;padding:24px;box-shadow:0 16px 45px #0002}
.auth-card h2{color:#087052;margin-top:0;text-align:center}
.auth-card input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #ccd6d0;border-radius:9px;font-size:16px}
.auth-error{color:#b71c1c;min-height:24px;text-align:center;margin:8px 0}
.logout{width:auto;background:#fff;color:#087052;padding:9px 16px;margin-top:8px}
.dashboard-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dashboard-actions a{display:block;text-align:center;background:#eef7f3;color:#087052;border:1px solid #b8ded0;border-radius:9px;padding:12px;font-weight:bold}
.section-heading{color:#087052;margin:28px 0 12px}
.item{background:white;border:1px solid #dfe6e2;border-radius:12px;padding:14px;margin-bottom:10px}
.item small{color:#66736d}
@media(max-width:650px){.dashboard-actions{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>لوحة إدارة معدات السعودية</h1>
<p>إدارة الإعلانات والرسائل والتعليقات</p>
<button id="logoutBtn" class="logout" hidden onclick="logoutAdmin()">تسجيل الخروج</button>
</header>

<div class="container">

<div class="box dashboard-actions">
<button class="refresh" onclick="loadDashboard()">تحديث الكل</button>
<a href="#messagesSection">الرسائل الخاصة</a>
<a href="../index.html" target="_blank" rel="noopener">فتح الموقع</a>
</div>

<h2 class="section-heading">الإعلانات</h2>
<div id="ads"><div class="status">جاري تحميل الإعلانات...</div></div>
<h2 id="messagesSection" class="section-heading">الرسائل الخاصة</h2>
<div id="messages"><div class="status">جاري تحميل الرسائل...</div></div>
<h2 class="section-heading">التعليقات</h2>
<div id="commentsAdmin"><div class="status">جاري تحميل التعليقات...</div></div>

<div id="editModal" class="modal">
 <div class="modal-box">
  <h2>تعديل الإعلان والصور</h2>
  <input id="editTitle" placeholder="عنوان الإعلان">
  <input id="editPrice" type="number" placeholder="السعر">
  <input id="editCity" placeholder="المدينة">
  <input id="editPhone" placeholder="الهاتف">
  <input id="editWhatsapp" placeholder="واتساب">
  <textarea id="editMessage" placeholder="الوصف"></textarea>
  <label><strong>الصور الحالية — اضغط × لحذف صورة</strong></label>
  <div id="oldImages" class="images"></div>
  <label><strong>إضافة صور جديدة</strong></label>
  <input id="editImages" type="file" accept="image/*" multiple>
  <button class="save" onclick="saveAd()">حفظ التعديلات</button>
  <button class="cancel" onclick="closeEdit()">إلغاء</button>
 </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://anhnbngfhxbmrbvvcqah.supabase.co";
const SUPABASE_KEY = "sb_publishable_KdNneYT0PkMo-0IrLGYOCA_e4-lrnyC";


const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentAd=null;
let currentImageFiles=[];

function safe(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[c]));}

async function listImages(id){
 const {data,error}=await supabaseClient.storage.from("ad-images").list(String(id),{limit:100,sortBy:{column:"name",order:"asc"}});
 if(error)return [];
 return (data||[]).filter(x=>x.name&&!x.name.startsWith(".")).map(x=>({name:x.name,url:supabaseClient.storage.from("ad-images").getPublicUrl(`${id}/${x.name}`).data.publicUrl}));
}

async function loadAds(){

const adsBox=document.getElementById("ads");

adsBox.innerHTML=
'<div class="status">جاري تحميل الإعلانات...</div>';

const {data,error}=await supabaseClient
.from("ads")
.select("*")
.order("created_at",{ascending:false}).order("id",{ascending:false});

if(error){
adsBox.innerHTML=
'<div class="status">تعذر تحميل الإعلانات</div>';
console.error(error);
return;
}

if(!data || data.length===0){
adsBox.innerHTML=
'<div class="status">لا توجد إعلانات حاليًا</div>';
return;
}

adsBox.innerHTML="";

for(const ad of data){

const div=document.createElement("div");
div.className="ad";

// Render the ad immediately. Images load independently so a storage request
// can never leave the whole admin dashboard stuck on "loading".
let imgs=[];
try{
 imgs=await Promise.race([
  listImages(ad.id),
  new Promise(resolve=>setTimeout(()=>resolve([]),3000))
 ]);
}catch(e){
 console.warn("Image loading failed for ad",ad.id,e);
 imgs=[];
}
div.innerHTML=`
<h3>${safe(ad.title || "بدون عنوان")}</h3>

<div class="images">${imgs.map(x=>`<img src="${safe(x.url)}" alt="">`).join("")||"لا توجد صور"}</div>

<p><strong>رقم الإعلان:</strong> ${ad.id || ""}</p>

<p><strong>السعر:</strong> ${safe(ad.price || "غير محدد")}</p>

<p><strong>المدينة:</strong> ${safe(ad.city || "غير محددة")}</p>

<p><strong>الهاتف:</strong> ${safe(ad.phone || "")}</p>

<p><strong>واتساب:</strong> ${safe(ad.whatsapp || "")}</p>

<p><strong>الوصف:</strong><br>${safe(ad.message || "")}</p>

<button class="edit" onclick="openEdit(${ad.id})">تعديل الإعلان والصور</button>

<button class="delete"
onclick="deleteAd(${ad.id})">
حذف الإعلان
</button>
`;

adsBox.appendChild(div);

}

}

async function openEdit(id){
 const {data,error}=await supabaseClient.from("ads").select("*").eq("id",id).single();
 if(error){alert("تعذر فتح الإعلان");return;}
 currentAd=data;
 editTitle.value=data.title||""; editPrice.value=data.price||""; editCity.value=data.city||"";
 editPhone.value=data.phone||""; editWhatsapp.value=data.whatsapp||""; editMessage.value=data.description||data.message||"";
 editImages.value="";
 await refreshOldImages();
 editModal.classList.add("open");
}

async function refreshOldImages(){
 currentImageFiles=await listImages(currentAd.id);
 oldImages.innerHTML=currentImageFiles.map(x=>`<div class="old-image"><img src="${safe(x.url)}"><button onclick="removeImage('${safe(x.name)}')">×</button></div>`).join("")||"لا توجد صور";
}

async function removeImage(name){
 if(!confirm("حذف هذه الصورة؟"))return;
 const {error}=await supabaseClient.storage.from("ad-images").remove([`${currentAd.id}/${name}`]);
 if(error){alert("تعذر حذف الصورة");return;}
 await refreshOldImages();
}

async function saveAd(){
 const description=editMessage.value.trim(); const changes={title:editTitle.value.trim(),price:editPrice.value||null,city:editCity.value.trim(),phone:editPhone.value.trim(),whatsapp:editWhatsapp.value.trim()||null,description,message:description};
 const {error}=await supabaseClient.from("ads").update(changes).eq("id",currentAd.id);
 if(error){alert("تعذر حفظ البيانات: "+error.message);return;}
 const files=[...editImages.files];
 const newUrls=[];
 for(let i=0;i<files.length;i++){
  const f=files[i],ext=(f.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${currentAd.id}/${Date.now()}_${i}.${ext}`;
  const up=await supabaseClient.storage.from("ad-images").upload(path,f,{upsert:false});
  if(up.error){alert("تم حفظ البيانات لكن تعذر رفع إحدى الصور");return;}
  const publicUrl=supabaseClient.storage.from("ad-images").getPublicUrl(path).data.publicUrl;
  newUrls.push(publicUrl);
  await supabaseClient.from("ad_images").insert([{ad_id:currentAd.id,image_url:publicUrl}]);
 }
 if(newUrls.length){ const existing=(await listImages(currentAd.id)).map(x=>x.url); await supabaseClient.from("ads").update({image_url:existing[0]||null,images:existing,image_urls:existing}).eq("id",currentAd.id); }
 alert("تم حفظ التعديلات والصور"); closeEdit(); loadAds();
}

function closeEdit(){editModal.classList.remove("open");currentAd=null;}

async function deleteAd(id){
 if(!confirm("هل أنت متأكد من حذف هذا الإعلان وصوره ورسائله؟")) return;
 const files=await listImages(id);
 if(files.length){
  const removal=await supabaseClient.storage.from("ad-images").remove(files.map(x=>`${id}/${x.name}`));
  if(removal.error){alert("تعذر حذف صور الإعلان: "+removal.error.message);return;}
 }
 const {error}=await supabaseClient.from("ads").delete().eq("id",id);
 if(error){alert("تعذر حذف الإعلان: "+error.message);return;}
 alert("تم حذف الإعلان نهائيًا");
 await loadDashboard();
}


async function loadMessages(){
 const box=document.getElementById("messages");
 const {data,error}=await supabaseClient.from("messages")
  .select("id,ad_id,message,created_at,ads(title)")
  .order("created_at",{ascending:false}).limit(200);
 if(error){box.innerHTML=`<div class="status">تعذر تحميل الرسائل: ${safe(error.message)}</div>`;return;}
 box.innerHTML=(data||[]).map(x=>`<div class="item">
  <strong>${safe(x.ads?.title||"إعلان رقم "+x.ad_id)}</strong>
  <p>${safe(x.message||"")}</p>
  <small>${x.created_at?new Date(x.created_at).toLocaleString("ar-SA"):""}</small>
  <button class="delete" onclick="deleteMessage(${Number(x.id)})">حذف الرسالة</button>
 </div>`).join("")||'<div class="status">لا توجد رسائل حاليًا</div>';
}
async function deleteMessage(id){
 if(!confirm("حذف هذه الرسالة؟"))return;
 const {error}=await supabaseClient.from("messages").delete().eq("id",id);
 if(error){alert("تعذر حذف الرسالة: "+error.message);return;}
 await loadMessages();
}
async function loadAdminComments(){
 const box=document.getElementById("commentsAdmin");
 const {data,error}=await supabaseClient.from("comments")
  .select("id,ad_id,author_name,comment,created_at,ads(title)")
  .order("created_at",{ascending:false}).limit(200);
 if(error){box.innerHTML=`<div class="status">تعذر تحميل التعليقات: ${safe(error.message)}</div>`;return;}
 box.innerHTML=(data||[]).map(x=>`<div class="item">
  <strong>${safe(x.author_name||"زائر")} — ${safe(x.ads?.title||"إعلان رقم "+x.ad_id)}</strong>
  <p>${safe(x.comment||"")}</p>
  <small>${x.created_at?new Date(x.created_at).toLocaleString("ar-SA"):""}</small>
  <button class="delete" onclick="deleteComment(${Number(x.id)})">حذف التعليق</button>
 </div>`).join("")||'<div class="status">لا توجد تعليقات حاليًا</div>';
}
async function deleteComment(id){
 if(!confirm("حذف هذا التعليق؟"))return;
 const {error}=await supabaseClient.from("comments").delete().eq("id",id);
 if(error){alert("تعذر حذف التعليق: "+error.message);return;}
 await loadAdminComments();
}
async function loadDashboard(){
 await Promise.all([loadAds(),loadMessages(),loadAdminComments()]);
}

function showPasswordReset(){
 let gate=document.getElementById("authGate");
 if(gate) gate.remove();
 gate=document.createElement("div"); gate.id="authGate"; gate.className="auth-gate";
 gate.innerHTML=`<form class="auth-card" onsubmit="saveNewPassword(event)">
  <h2>تعيين كلمة مرور جديدة</h2>
  <p style="text-align:center">اكتب كلمة المرور الجديدة لحساب المدير</p>
  <input id="newAdminPassword" type="password" autocomplete="new-password" placeholder="كلمة المرور الجديدة" minlength="8" required>
  <input id="confirmAdminPassword" type="password" autocomplete="new-password" placeholder="تأكيد كلمة المرور الجديدة" minlength="8" required>
  <div id="authError" class="auth-error"></div>
  <button class="refresh" type="submit">حفظ كلمة المرور الجديدة</button>
 </form>`;
 document.body.appendChild(gate);
 logoutBtn.hidden=true;
}

async function saveNewPassword(e){
 e.preventDefault();
 const p=newAdminPassword.value;
 if(p!==confirmAdminPassword.value){authError.textContent="كلمتا المرور غير متطابقتين";return;}
 authError.textContent="جاري حفظ كلمة المرور...";
 const {error}=await supabaseClient.auth.updateUser({password:p});
 if(error){authError.textContent="تعذر تغيير كلمة المرور: "+error.message;return;}
 authError.style.color="#087052";
 authError.textContent="تم تغيير كلمة المرور بنجاح. سيتم فتح لوحة الإدارة الآن.";
 setTimeout(()=>{document.getElementById("authGate")?.remove();logoutBtn.hidden=false;loadDashboard();},1200);
}

function showLogin(){
 let gate=document.getElementById("authGate");
 if(!gate){
  gate=document.createElement("div"); gate.id="authGate"; gate.className="auth-gate";
  gate.innerHTML=`<form class="auth-card" onsubmit="loginAdmin(event)">
   <h2>دخول مدير الموقع</h2>
   <input id="adminEmail" type="email" autocomplete="username" placeholder="البريد الإلكتروني" required>
   <input id="adminPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور" required>
   <div id="authError" class="auth-error"></div>
   <button class="refresh" type="submit">تسجيل الدخول</button>
  </form>`;
  document.body.appendChild(gate);
 }
 gate.style.display="flex";
 logoutBtn.hidden=true;
}

async function loginAdmin(e){
 e.preventDefault(); authError.textContent="جاري تسجيل الدخول...";
 const {error}=await supabaseClient.auth.signInWithPassword({email:adminEmail.value.trim(),password:adminPassword.value});
 if(error){authError.textContent="البريد أو كلمة المرور غير صحيحة";return;}
 document.getElementById("authGate")?.remove(); logoutBtn.hidden=false; loadDashboard();
}

async function logoutAdmin(){await supabaseClient.auth.signOut();location.reload();}

let recoveryMode=false;
supabaseClient.auth.onAuthStateChange((event)=>{
 if(event==="PASSWORD_RECOVERY"){
  recoveryMode=true;
  setTimeout(showPasswordReset,0);
 }
});

async function startAdmin(){
 // Recovery links normally contain auth tokens in the URL hash. Give the
 // Supabase client a moment to emit PASSWORD_RECOVERY before showing admin UI.
 if(location.hash.includes("type=recovery")){
  recoveryMode=true;
  setTimeout(showPasswordReset,0);
  return;
 }
 const {data}=await supabaseClient.auth.getSession();
 if(!data.session){showLogin();return;}
 logoutBtn.hidden=false; loadDashboard();
}

startAdmin();

</script>

</body>
</html>
