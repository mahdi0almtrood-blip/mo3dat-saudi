<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة إعلانات معدات السعودية</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7f5;
  color:#17221d;
}

header{
  background:#087052;
  color:white;
  padding:22px;
  text-align:center;
}

.container{
  max-width:900px;
  margin:25px auto;
  padding:15px;
}

.box,.ad{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  border:1px solid #dfe6e2;
}

.ad h3{
  color:#087052;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:13px;
  font-size:16px;
  cursor:pointer;
}

.refresh{
  background:#087052;
  color:white;
}

.delete{
  background:#c62828;
  color:white;
  margin-top:10px;
}

.edit{background:#087052;color:white;margin-top:10px}
.images{display:flex;gap:8px;overflow:auto;margin:12px 0}
.images img{width:105px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;padding:15px;overflow:auto}
.modal.open{display:block}
.modal-box{max-width:650px;margin:20px auto;background:white;border-radius:14px;padding:20px}
.modal input,.modal textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 12px;border:1px solid #ccd6d0;border-radius:8px}
.modal textarea{min-height:110px}
.save{background:#087052;color:white;margin-top:10px}
.cancel{background:#eee;color:#222;margin-top:8px}
.old-image{position:relative;flex:none}
.old-image button{position:absolute;top:3px;left:3px;width:28px;height:28px;padding:0;background:#c62828;color:white;border-radius:50%}

.status{
  text-align:center;
  padding:15px;
}
</style>
</head>

<body>

<header>
<h1>لوحة إدارة معدات السعودية</h1>
<p>إدارة الإعلانات</p>
</header>

<div class="container">

<div class="box">
<button class="refresh" onclick="loadAds()">
تحديث الإعلانات
</button>
</div>

<div id="ads">
<div class="status">جاري تحميل الإعلانات...</div>
</div>

<div id="editModal" class="modal">
 <div class="modal-box">
  <h2>تعديل الإعلان والصور</h2>
  <input id="editTitle" placeholder="عنوان الإعلان">
  <input id="editPrice" type="number" placeholder="السعر">
  <input id="editCity" placeholder="المدينة">
  <input id="editPhone" placeholder="الهاتف">
  <input id="editWhatsapp" placeholder="واتساب">
  <textarea id="editMessage" placeholder="الوصف"></textarea>
  <label><strong>الصور الحالية — اضغط × لحذف صورة</strong></label>
  <div id="oldImages" class="images"></div>
  <label><strong>إضافة صور جديدة</strong></label>
  <input id="editImages" type="file" accept="image/*" multiple>
  <button class="save" onclick="saveAd()">حفظ التعديلات</button>
  <button class="cancel" onclick="closeEdit()">إلغاء</button>
 </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://anhnbngfhxbmrbvvcqah.supabase.co";
const SUPABASE_KEY = "sb_publishable_KdNneYT0PkMo-0IrLGYOCA_e4-lrnyC";


const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentAd=null;
let currentImageFiles=[];

function safe(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#039;"}[c]));}

async function listImages(id){
 const {data,error}=await supabaseClient.storage.from("ad-images").list(String(id),{limit:100,sortBy:{column:"name",order:"asc"}});
 if(error)return [];
 return (data||[]).filter(x=>x.name&&!x.name.startsWith(".")).map(x=>({name:x.name,url:supabaseClient.storage.from("ad-images").getPublicUrl(`${id}/${x.name}`).data.publicUrl}));
}

async function loadAds(){

const adsBox=document.getElementById("ads");

adsBox.innerHTML=
'<div class="status">جاري تحميل الإعلانات...</div>';

const {data,error}=await supabaseClient
.from("ads")
.select("*")
.order("id",{ascending:false});

if(error){
adsBox.innerHTML=
'<div class="status">تعذر تحميل الإعلانات</div>';
console.error(error);
return;
}

if(!data || data.length===0){
adsBox.innerHTML=
'<div class="status">لا توجد إعلانات حاليًا</div>';
return;
}

adsBox.innerHTML="";

for(const ad of data){

const div=document.createElement("div");
div.className="ad";

const imgs=await listImages(ad.id);
div.innerHTML=`
<h3>${safe(ad.title || "بدون عنوان")}</h3>

<div class="images">${imgs.map(x=>`<img src="${safe(x.url)}" alt="">`).join("")||"لا توجد صور"}</div>

<p><strong>رقم الإعلان:</strong> ${ad.id || ""}</p>

<p><strong>السعر:</strong> ${safe(ad.price || "غير محدد")}</p>

<p><strong>المدينة:</strong> ${safe(ad.city || "غير محددة")}</p>

<p><strong>الهاتف:</strong> ${safe(ad.phone || "")}</p>

<p><strong>واتساب:</strong> ${safe(ad.whatsapp || "")}</p>

<p><strong>الوصف:</strong><br>${safe(ad.message || "")}</p>

<button class="edit" onclick="openEdit(${ad.id})">تعديل الإعلان والصور</button>

<button class="delete"
onclick="deleteAd(${ad.id})">
حذف الإعلان
</button>
`;

adsBox.appendChild(div);

}

}

async function openEdit(id){
 const {data,error}=await supabaseClient.from("ads").select("*").eq("id",id).single();
 if(error){alert("تعذر فتح الإعلان");return;}
 currentAd=data;
 editTitle.value=data.title||""; editPrice.value=data.price||""; editCity.value=data.city||"";
 editPhone.value=data.phone||""; editWhatsapp.value=data.whatsapp||""; editMessage.value=data.message||"";
 editImages.value="";
 await refreshOldImages();
 editModal.classList.add("open");
}

async function refreshOldImages(){
 currentImageFiles=await listImages(currentAd.id);
 oldImages.innerHTML=currentImageFiles.map(x=>`<div class="old-image"><img src="${safe(x.url)}"><button onclick="removeImage('${safe(x.name)}')">×</button></div>`).join("")||"لا توجد صور";
}

async function removeImage(name){
 if(!confirm("حذف هذه الصورة؟"))return;
 const {error}=await supabaseClient.storage.from("ad-images").remove([`${currentAd.id}/${name}`]);
 if(error){alert("تعذر حذف الصورة");return;}
 await refreshOldImages();
}

async function saveAd(){
 const changes={title:editTitle.value.trim(),price:editPrice.value||null,city:editCity.value.trim(),phone:editPhone.value.trim(),whatsapp:editWhatsapp.value.trim()||null,message:editMessage.value.trim()};
 const {error}=await supabaseClient.from("ads").update(changes).eq("id",currentAd.id);
 if(error){alert("تعذر حفظ البيانات: "+error.message);return;}
 const files=[...editImages.files];
 for(let i=0;i<files.length;i++){
  const f=files[i],ext=(f.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${currentAd.id}/${Date.now()}_${i}.${ext}`;
  const up=await supabaseClient.storage.from("ad-images").upload(path,f,{upsert:false});
  if(up.error){alert("تم حفظ البيانات لكن تعذر رفع إحدى الصور");return;}
 }
 alert("تم حفظ التعديلات والصور"); closeEdit(); loadAds();
}

function closeEdit(){editModal.classList.remove("open");currentAd=null;}

async function deleteAd(id){

if(!confirm("هل أنت متأكد من حذف هذا الإعلان؟"))
return;

const {error}=await supabaseClient
.from("ads")
.delete()
.eq("id",id);

if(error){
alert("تعذر حذف الإعلان");
console.error(error);
return;
}

alert("تم حذف الإعلان");
loadAds();

}

loadAds();

</script>

</body>
</html>
